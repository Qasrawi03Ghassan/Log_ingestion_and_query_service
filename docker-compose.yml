services:
  pg-db:
    image: timescale/timescaledb:latest-pg16
    labels:
      - load-generator.role=postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: log_ingestor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d log_ingestor"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - wal_buffers=16MB
      - -c
      - min_wal_size=256MB
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - synchronous_commit=off

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@pg-db:5432/log_ingestor?sslmode=disable
      PORT: 8080
      RETENTION_DAYS: 30
      RETENTION__CHECK_PERIOD_HOURS: 24
      RETENTION_BATCH_MAX_SIZE: 10000
    depends_on:
      pg-db:
        condition: service_healthy
    command: sh -c "npm run db-migrate && npm run test && npm run start"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
