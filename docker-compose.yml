services:
  pg-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: log_ingestor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d log_ingestor"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@pg-db:5432/log_ingestor?sslmode=disable
      PORT: 8080
      RETENTION_DAYS: 30
      RETENTION__CHECK_PERIOD_HOURS: 24
      RETENTION_BATCH_MAX_SIZE: 10000
    depends_on:
      pg-db:
        condition: service_healthy
    command: sh -c "npm run db-migrate && npm run test && npm run start"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
